server:
  port: 8090

logging:
  level:
    io.lettuce: DEBUG
    org.springframework.data.redis: DEBUG
    sunj.be: DEBUG

spring:
  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    export:
      prometheus:
        enabled: true