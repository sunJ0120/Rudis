services:
  # Rudis Redis 클론 서버
  rudis:
    build:
      context: ./rudis
      dockerfile: Dockerfile
    container_name: rudis-server
    ports:
      - "6380:6380"
    networks:
      - rudis-network
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6380", "PING"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Spring Boot 성능 테스트 서버
  spring-be:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: spring-be
    ports:
      - "8090:8090"
    depends_on:
      rudis:
        condition: service_healthy
#      prometheus:
#        condition: service_started
    networks:
      - rudis-network
      - app-network
    environment:
      - SPRING_DATA_REDIS_HOST=rudis
      - SPRING_DATA_REDIS_PORT=6380
#      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus

  # Prometheus: 메트릭 수집
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - app-network
    depends_on:
      - spring-be

  # Grafana: 메트릭 시각화
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:

networks:
  rudis-network:
    driver: bridge
  app-network:
    driver: bridge